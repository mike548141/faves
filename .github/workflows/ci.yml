# CI for Faves. The site ships build-less, so this is a correctness gate, not
# a build: it proves the menu data validates against the schema, and that every
# screen still runs at all, when a change reaches `main` (which auto-deploys to
# Cloudflare Pages) and on every PR. Python here is stdlib-only, and the one
# browser job installs nothing — nothing to install anywhere.
#
# Build-less is also WHY a browser belongs in this file: with no bundler and no
# type checker, nothing but a running page can tell you a module forgot an
# import. See the `boot` job.
#
# ⚠ It REPORTS; it does not reliably BLOCK. `protect-main` requires four of
# these contexts, but repository admins bypass it always — and the last 100
# rule evaluations on `main` were 100 bypasses. Read a red run as "the deploy
# that just went out is broken", not as "the deploy was stopped".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: menu data validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate restaurant JSON against the schema
        run: python3 tools/validate.py
      # A validator's failure mode is silence — a check that never fires looks
      # exactly like data that is always clean. This breaks a real record in
      # 14 specific ways and asserts the gate notices. It found a real hole on
      # its first run: a negative price validated clean.
      - name: Prove the data gate actually catches things
        run: python3 tools/test_validate.py

  guard:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails if package.json ever grows a dependency, or a lockfile /
      # node_modules appears — the invariant ADR 0001 rests on.
      - name: Assert no third-party dependencies
        run: python3 tools/check_no_deps.py
      # The published SBOM must match the shipped tree — deterministic, so a
      # stale commit fails here (ADR 0008). Proves the zero-dep claim, and any
      # future third-party entry shows up as a diff.
      - name: Assert the committed SBOM is current
        run: python3 tools/gen_sbom.py --check
      # CLAUDE.md's visibility bullet decides whether a push is recoverable or
      # is irreversible publication. It still read PRIVATE hours after the repo
      # was made public, and nothing in the floor would ever have noticed. The
      # runner already holds the truth in the event payload, so this costs no
      # token and no API call.
      - name: Assert the stated repo visibility is still true
        run: >-
          python3 tools/check_visibility.py
          --actual ${{ github.event.repository.private && 'private' || 'public' }}
      # docs/decisions/README.md is the ALLOCATOR, not a table of contents: the
      # next session reads it to pick a number. An unindexed record is invisible
      # to it, which is how a duplicate 0025 survived. An audit on 2026-08-16
      # found seven records missing — including a contiguous 0042–0045 run, the
      # shape most likely to cause a reuse. A guard that fails silently seven
      # times is not a guard, so it is a gate now.
      - name: Assert every decision record is indexed
        run: python3 tools/check_decisions.py
      # The no-JS `<ul>` in site/index.html is the home screen a reader gets
      # when app.js has not run — which is not hypothetical: an unimported
      # symbol made it the live home screen on 2026-08-16 while 570 unit tests
      # stayed green. CLAUDE.md has carried the lockstep rule since the repo's
      # conventions were written and NOTHING has ever checked it. First run
      # found nine venues with finished menus rendered as unreachable "Menu
      # coming soon" cards, four of them landed the day before.
      - name: Assert the no-JS fallback mirrors index.json
        run: python3 tools/check_fallback.py

  versions:
    name: service-worker version lockstep
    runs-on: ubuntu-latest
    steps:
      # Needs history, not just the tip: the check compares two states, and a
      # shallow clone has nothing to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Change a file under site/ without bumping the matching constant in
      # sw.js and the install step SKIPS that cache entirely — installed phones
      # keep serving the old files indefinitely, with CI green and no error
      # anywhere. It shipped exactly that way on 2026-08-16 (the FX merge
      # changed 19 shell files at SHELL_VERSION .13) and surfaced only when the
      # owner hit it on his own phone. The range differs by event: a PR is
      # judged against its base, a push against what main was before it.
      - name: Assert sw.js versions were bumped in lockstep
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..HEAD"
          else
            echo "No comparable base for this event — nothing to check."
            exit 0
          fi
          echo "Range: $RANGE"
          python3 tools/check_versions.py --range "$RANGE"
      # And prove the guard can still fire. It found a flaw in itself on its
      # first run — sw.js was being counted as a shell file, so every data-only
      # menu edit (which bumps DATA_VERSION, i.e. edits sw.js) was flagged. A
      # guard that cries wolf on the correct action gets overridden into
      # decoration, which is how four earlier checks here went quiet.
      - name: Prove the version guard actually catches things
        run: python3 tools/test_check_versions.py

  test:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step — there are no dependencies. package.json exists
      # only to declare ESM + the test script; node's built-in runner does
      # the rest.
      - name: Run the unit tests
        run: node --test

  # THE ONE BROWSER CHECK CI RUNS — owner's ruling, 2026-08-16.
  #
  # TEN real-browser guards live in tools/ (count them: `ls tools/*_check.mjs`,
  # and note the roadmap item that authorised this still says eight — the family
  # grew under it). Nine stay on CLAUDE.md's manual list; this one is wired up
  # because it is the only one that is both cheap and
  # unconditional — it makes no timing assumptions, and it catches the worst
  # failure class there is: a screen whose JavaScript does not run at all.
  # On 2026-08-16 `app.js` called `venueTimezone` without importing it, `init()`
  # threw, the home screen silently served its no-JS fallback `<ul>`, and 570
  # unit tests, `device_check` 19/19 and `cook_check` 36/36 were all green. The
  # fallback is what hid it — the wreck looked like a working list of places.
  # Running the whole family, and a nightly run, were both costed and declined:
  # `cook_check` is measurably contention-flaky and `sync_check` drives two
  # browsers for minutes, and a flaky required check trains everyone to hit
  # re-run, which is worse than no check.
  #
  # WHAT IT CANNOT DO — read this before calling it a gate. The `protect-main`
  # ruleset lets a repository admin bypass required status checks
  # (`bypass_mode: always`), and the last 100 rule evaluations on `main` were
  # 100 bypasses. So on this repo's normal path — a direct push to `main`, which
  # IS the Cloudflare Pages deploy — the red arrives *after* the site is live.
  # This job WAS added to the ruleset's required list on 2026-08-17 (four checks
  # became six) — which it could only be once the job existed. But the bypass is
  # unchanged, so the resting state is REQUIRED-BUT-BYPASSABLE: correct, and it
  # closes nothing in practice until the bypass is narrowed. What it buys today
  # is that the check runs at all without a human remembering to type it, which
  # is exactly how `sync_check` sat dead through a whole settings refactor with
  # CI green throughout.
  boot:
    name: every screen boots
    runs-on: ubuntu-latest
    env:
      # tools/lib/browser.mjs defaults to the macOS Chrome path and takes this
      # override; it is the only hook, and the tool is not edited for CI.
      FAVES_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner image already ships Google Chrome (151.0.7922.108 on
      # ubuntu-24.04 image 20260810.271.1, measured on the runner 2026-08-17,
      # not read from documentation) — so no marketplace action, no download,
      # and no new
      # trust surface in a public repo's workflow. Measured too: headless Chrome
      # launches clean as the unprivileged `runner` user, so none of the usual
      # `--no-sandbox` / `--disable-dev-shm-usage` folklore is needed.
      # This step exists so that an image which stops shipping Chrome reads as
      # "the runner lost its browser" rather than "a screen failed to boot". A
      # guard whose failure names the wrong thing teaches people to ignore red.
      - name: Confirm the runner still ships the browser this needs
        run: |
          if [ ! -x "$FAVES_CHROME" ]; then
            echo "::error::No Chrome at $FAVES_CHROME — the runner image changed. This is an environment failure, NOT a failing screen: re-point FAVES_CHROME at the browser the image ships."
            exit 1
          fi
          "$FAVES_CHROME" --version
      # Loads the home screen, four menu screens, the facet round-trip, Settings
      # and About on a fresh profile, and asserts each was drawn by its own
      # JavaScript rather than by the fail-soft markup standing in for it.
      - name: Assert every screen is drawn by its own JavaScript
        run: node tools/boot_check.mjs
