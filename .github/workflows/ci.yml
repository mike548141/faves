# CI for Faves. The site ships build-less, so this is a correctness gate,
# not a build: it proves the menu data validates against the schema
# before anything reaches `main` (and `main` auto-deploys to Cloudflare
# Pages). stdlib-only Python — nothing to install.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: menu data validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate restaurant JSON against the schema
        run: python3 tools/validate.py

  guard:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails if package.json ever grows a dependency, or a lockfile /
      # node_modules appears — the invariant ADR 0001 rests on.
      - name: Assert no third-party dependencies
        run: python3 tools/check_no_deps.py
      # The published SBOM must match the shipped tree — deterministic, so a
      # stale commit fails here (ADR 0008). Proves the zero-dep claim, and any
      # future third-party entry shows up as a diff.
      - name: Assert the committed SBOM is current
        run: python3 tools/gen_sbom.py --check
      # CLAUDE.md's visibility bullet decides whether a push is recoverable or
      # is irreversible publication — it read PRIVATE for three days after the
      # repo went public and nothing noticed. The runner already holds the
      # truth in the event payload, so this costs no token and no API call.
      - name: Assert the stated repo visibility is still true
        run: >-
          python3 tools/check_visibility.py
          --actual ${{ github.event.repository.private && 'private' || 'public' }}

  test:
    name: JS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step — there are no dependencies. package.json exists
      # only to declare ESM + the test script; node's built-in runner does
      # the rest.
      - name: Run the unit tests
        run: node --test
