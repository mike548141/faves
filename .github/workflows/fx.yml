# Refresh the exchange rates Faves ships (ADR 0045).
#
# Faves converts menu prices offline, from rates committed as data — it never
# calls an FX API at runtime, because the site must work in flight mode and
# carries no third-party dependency (ADR 0001). The cost of that choice is
# staleness, and this is what pays it down: once a day, fetch, and commit only
# if a rate actually moved.
#
# Two things worth knowing before changing this:
#
#   • A push to `main` IS a deploy — Cloudflare Pages builds from it. So this
#     job deploys the site up to once a week, by design.
#   • It needs a RULESET BYPASS to push at all. `protect-main` requires four
#     status checks, and a direct push can never satisfy them — the checks run
#     on the push the rule is refusing. Proved on 2026-08-16, not assumed:
#     "GH013: Repository rule violations found … 4 of 4 required status checks
#     are expected … [remote rejected]". The bypass is only defensible because
#     this job runs those four checks itself, below, before the commit exists.
#   • `--bump` moves DATA_VERSION in sw.js in the same commit. Without it the
#     new rates would sit in the repo while every installed phone kept serving
#     the cached old ones, which is the lockstep rule in CLAUDE.md and the one
#     a scheduled job can't be trusted to remember by hand.
name: FX rates

on:
  schedule:
    # Weekly, Sunday 14:10 UTC — Monday ~2am in New Zealand, so the deploy this
    # triggers lands when nobody is mid-order. Weekly rather than daily on the
    # owner's call (2026-08-16): a menu price is read off a wall months apart,
    # so a rate a few days old is nowhere near the biggest approximation in the
    # figure a reader sees. GitHub runs cron on UTC and may delay a scheduled
    # job under load; a missed week is harmless, which is why this is a
    # schedule and not an alarm.
    - cron: "10 14 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Write and commit even if no rate moved (for testing the pipeline)"
        type: boolean
        default: false

# Least privilege: this job writes one data file and one version constant.
permissions:
  contents: write

concurrency:
  # Never two refreshes racing each other onto main.
  group: fx-rates
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh site/data/fx.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch the latest rates
        run: python3 tools/fetch_fx.py --bump ${{ inputs.force && '--force' || '' }}

      # The tool is a no-op when no rate moved, so an unchanged tree is the
      # normal outcome most days, not a failure.
      - name: Did anything change?
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No rate moved since the committed snapshot — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # THE SAME FOUR CHECKS the protect-main ruleset requires, run here, before
      # the commit exists — not as belt and braces but as the substance of the
      # rule. A scheduled job cannot satisfy a required status check on a direct
      # push (the check runs after the push the rule is refusing), so for this
      # job to work at all it needs a bypass. A bypass is only defensible if
      # nothing is actually skipped, and this is what makes that true: whatever
      # the ruleset would have demanded afterwards has already passed here.
      #
      # If you add a required check to the ruleset, add it here too, or the
      # bypass quietly starts skipping something real.
      - name: Everything the ruleset would have required
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 tools/fetch_fx.py --check   # the rate file loads and its base is sane
          python3 tools/validate.py           # "menu data validates"
          python3 tools/test_validate.py      # ...and that gate still catches things
          python3 tools/check_no_deps.py      # "zero dependencies"
      - name: JS unit tests
        if: steps.diff.outputs.changed == 'true'
        run: node --test

      - name: Commit and deploy
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "faves-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AS_OF=$(python3 -c "import json;print(json.load(open('site/data/fx.json'))['asOf'])")
          git add site/data/fx.json site/sw.js
          git commit -m "data: refresh FX rates (as at ${AS_OF})" \
                     -m "Automated weekly refresh — tools/fetch_fx.py --bump." \
                     -m "Rates are reference rates, not transaction rates; the app says so beside the prices."
          # Rebase rather than force: a human may have pushed while this ran,
          # and their commit is worth more than this one.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
