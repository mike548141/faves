<!DOCTYPE html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Menu — Faves</title>
    <meta name="description" content="Menu, prices and allergen info." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Faves" />
    <meta property="og:title" content="Menu — Faves" />
    <meta property="og:description" content="Menu, prices and allergen info for one of our favourite places to eat." />
    <meta property="og:image" content="https://lets-eat.myspot.nz/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#faf5ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="menu-page">
    <!-- Slim top bar: back-link (left) + the app ⋯ menu (right), so the app
         chrome (Settings / Share / About / Favourites) is one tap away here too,
         not only on the home screen. It scrolls away with the page (not sticky),
         matching home. JS wires it (menu.js initChrome); overflow-ui unhides. -->
    <div class="menu-topbar wrap">
      <p class="skip"><a href="index.html" data-i18n="nav.allRestaurants">← All places</a></p>
      <div class="overflow" hidden>
        <button
          type="button"
          id="overflow-btn"
          class="overflow-btn"
          aria-label="More"
          data-i18n-aria="nav.more"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="overflow-menu"
        >
          <span aria-hidden="true">⋯</span>
        </button>
        <div id="overflow-menu" class="overflow-menu" role="menu" aria-label="More" data-i18n-aria="nav.more" hidden>
          <p class="overflow-caption">
            <span data-i18n="profile.browsingAs">Browsing as</span>
            <span class="profile-caption-name"></span>
          </p>
          <!-- The favourites *view* lives on home, so here it's a link there
               (opened via #faves) rather than the in-page toggle home uses. -->
          <a id="favourites-link" class="overflow-item" role="menuitem" href="index.html#faves">
            <span class="overflow-item-icon" aria-hidden="true">♥</span>
            <span data-i18n="nav.favourites">Favourites</span>
          </a>
          <!-- Settings (owner wants it here). Safe because menu.js now re-applies
               the allergen/dietary treatment live on a change (wireLiveSafety) —
               same markup as index.html so both ⋯ menus read identically. -->
          <button type="button" id="shopping-btn" class="overflow-item" role="menuitem" hidden>
            <span class="overflow-item-icon" aria-hidden="true">🛒</span>
            <span data-i18n="nav.shopping">Shopping list</span>
            <span class="shop-count" aria-hidden="true" hidden></span>
          </button>
          <button type="button" id="share-app-btn" class="overflow-item" role="menuitem" hidden>
            <span class="overflow-item-icon" aria-hidden="true">⤴</span>
            <span data-i18n="nav.shareApp">Share this app</span>
          </button>
          <button
            type="button"
            id="settings-btn"
            class="overflow-item"
            role="menuitem"
            hidden
          >
            <span class="overflow-item-icon" aria-hidden="true">⚙</span>
            <span data-i18n="nav.settings">Settings</span>
          </button>
        </div>
      </div>
    </div>

    <main id="menu-root" class="wrap" aria-busy="true">
      <p id="menu-loading" class="menu-status" data-i18n="menu.loading">Loading menu…</p>
      <p id="menu-error" class="menu-status" hidden>
        Couldn’t load this menu. <a href="index.html">Go back to all places</a>,
        or check your connection and reload.
      </p>
      <noscript>
        <p class="menu-status">
          This menu needs JavaScript to load. <a href="index.html">Back to all places</a>.
        </p>
      </noscript>
    </main>

    <!-- The home screen's footer, on every page (owner, 2026-09-29, ADR 0142).
         OUTSIDE <main> because the page's JS replaces main's children on every
         render. Only the link row: the no-JS privacy paragraph is home's, and
         this page cannot render without JS anyway. Cook mode needs no rule to
         hide it — it is a full-viewport modal with an opaque backdrop. -->
    <footer class="site-footer wrap">
      <p class="footer-line">
        <button type="button" id="about-open" class="footer-link" hidden data-i18n="footer.about">About &amp; privacy</button>
        <button type="button" id="suggest-open" class="footer-link" hidden data-i18n="footer.suggest">Suggestions</button>
        <span class="footer-made"><span data-i18n="footer.made">Made by</span> <span class="footer-brand">cakeIT</span></span>
      </p>
    </footer>

    <script type="module" src="js/menu.js"></script>
    <script type="module" src="js/sw-register.js"></script>
  </body>
</html>
